# Runs every test on each push and pull request, on Linux and on Windows.
# The tests use no network and no secret: Netatmo, Open-Meteo and MeteoAlarm are simulated.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Program
        run: python -m unittest discover -v
      - name: Server install and update tools
        working-directory: version-vps
        run: python -m unittest discover -v
